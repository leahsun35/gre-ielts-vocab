<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>词汇岛 · GRE &amp; IELTS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><a class="brand" href="#"><span class="brand-mark">v.</span><span>词汇岛</span></a><span class="top-note">每天一点，积累看得见</span></header>
    <section class="intro">
      <div class="intro-copy"><p class="eyebrow">YOUR DAILY WORD PRACTICE</p><h1>把单词，变成<br><em>自己的表达。</em></h1><p class="subtitle">从 GRE、IELTS 示例词和开放许可的通用及学术词表中学习。</p></div>
      <div class="progress-card"><div class="progress-top"><span>今日学习</span><span id="progress-label">0 / 100</span></div><div class="progress-track"><span id="progress-fill"></span></div><p id="progress-note">开始今天的第一张卡片吧</p></div>
    </section>
    <section class="study-area" aria-label="单词学习">
      <div class="toolbar"><div class="filters" role="group" aria-label="选择词库"><button class="filter active" data-exam="all">全部</button><button class="filter" data-exam="GRE">GRE</button><button class="filter" data-exam="IELTS">IELTS</button><button class="filter" data-exam="NGSL 1.01">NGSL</button><button class="filter" data-exam="NAWL 1.0">NAWL</button><button class="filter" data-exam="AKL">AKL</button></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索单词或释义" aria-label="搜索单词或释义"></label></div>
      <article class="word-card" id="word-card">
        <div class="card-meta"><span id="word-category" class="tag">GRE</span><span id="word-count">01 / 20</span></div>
        <div class="word-main"><h2 id="word">abate</h2><button id="sound" class="sound" aria-label="播放发音" title="播放发音">⌁</button></div>
        <p id="pronunciation" class="pronunciation">/əˈbeɪt/ <span>verb</span></p>
        <div class="meaning-block"><p class="label">释义 / Meaning</p><p id="meaning" class="meaning">减弱；缓和</p></div>
        <div class="example-block"><p class="label">例句</p><p id="example" class="example">The storm began to abate before dawn.</p></div>
        <p id="empty-state" class="empty-state" hidden>没有找到匹配的单词，试试其他搜索词吧。</p>
        <div class="card-actions"><button id="skip" class="button button-light">跳过</button><button id="know" class="button button-primary">我记住了 <span>→</span></button></div>
      </article>
      <p class="keyboard-hint">按 <kbd>空格</kbd> 翻看释义　·　学习进度保存在当前浏览器</p>
    </section>
    <footer><span>小步学习，持续进步。</span><span id="mastered-total">已掌握 0 个词</span></footer>
  </main>
  <script src="app.js?v=20261029-4" defer></script>
</body>
</html>
